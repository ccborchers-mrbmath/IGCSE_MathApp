    <!-- Discovered by the preload scanner before the CSS bundle is parsed, so
         the font request and the TLS handshake to the font host both start
         immediately rather than after a chain of dependent downloads. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    />
